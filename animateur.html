function startQuiz() {
  const countSel = parseInt(document.getElementById('quiz-count-sel').value)||15;
  let pool = document.getElementById('theme-sel').value
    ? QUIZ.filter(q=>q.theme===document.getElementById('theme-sel').value)
    : [...QUIZ];
  // Shuffle pool
  pool = pool.sort(()=>Math.random()-.5);
  // Take N questions
  quizQ = countSel > 0 ? pool.slice(0, countSel) : pool;
  quizIdx=-1; quizPhase='question';
  Object.keys(players).forEach(id=>{players[id].score=0;players[id].correct=0;});
  nextQ();
}
function nextQ() {
  quizIdx++;
  if (quizIdx>=quizQ.length) { showPodium(); return; }
  currentQ=quizQ[quizIdx]; quizAnswers={};
  quizPhase='question';
  timerDur=parseInt(document.getElementById('timer-sel').value)||15;
  timerLeft=timerDur;
  Object.keys(players).forEach(id=>players[id].answered=false);
  pub('host:question',{index:quizIdx,total:quizQ.length,question:{q:currentQ.q,opts:currentQ.opts,theme:currentQ.theme},timerDuration:timerDur,mod:'quiz'});
  startTimer(); renderQuizCenter();
  document.getElementById('phase-pill').textContent='Q'+(quizIdx+1)+'/'+quizQ.length;
}
function startTimer() {
  clearInterval(timerInterval);
  timerInterval=setInterval(()=>{
    timerLeft--;
    pub('host:tick',{timeLeft:timerLeft});
    const n=document.getElementById('tnum'),f=document.getElementById('tfill');
    if(n){const pct=timerLeft/timerDur*100,tc=pct>50?'var(--green)':pct>25?'var(--amber)':'var(--red)';n.textContent=timerLeft;n.style.color=tc;if(f){f.style.width=pct+'%';f.style.background=tc;}}
    if(timerLeft<=0) revealQuiz();
  },1000);
}
function revealQuiz() {
  if(quizPhase!=='question') return;
  clearInterval(timerInterval); quizPhase='reveal';
  pub('host:reveal',{correct:currentQ.correct,correctText:currentQ.opts[currentQ.correct],expl:currentQ.expl,mod:'quiz',scores:Object.fromEntries(Object.entries(players).map(([id,p])=>[id,{score:p.score,correct:p.correct}]))});
  renderQuizCenter(); updateRight();
}
function showPodium() {
  clearInterval(timerInterval); quizPhase='podium';
  const sorted=Object.values(players).sort((a,b)=>b.score-a.score);
  const ts=teamDefs.map(t=>{const m=Object.values(players).filter(p=>p.team===t.name);return{name:t.name,color:t.color,total:m.reduce((s,p)=>s+p.score,0)};}).sort((a,b)=>b.total-a.total);
  pub('host:podium',{scores:sorted.map(p=>({name:p.name,score:p.score,correct:p.correct,team:p.team||null})),teams:ts,mod:'quiz'});
  renderQuizCenter(); updateRight();
  document.getElementById('phase-pill').textContent='podium';
}
function resetQuiz() {
  clearInterval(timerInterval); quizPhase='lobby'; quizIdx=-1; currentQ=null; quizAnswers={};
  Object.keys(players).forEach(id=>{players[id].score=0;players[id].correct=0;});
  pub('host:reset',{mod:'quiz'}); renderQuizCenter(); updateRight();
  document.getElementById('phase-pill').textContent='lobby';
}
function updateLiveQuiz() {
  if(!currentQ) return;
  const colors=['#e21b3c','#1368ce','#d89e00','#26890c'];
  const total=Math.max(1,Object.keys(players).length);
  const counts=[0,0,0,0];
  Object.values(quizAnswers).forEach(a=>{if(a>=0&&a<4)counts[a]++;});

function checkPw(pw) {
  const len=pw.length; document.getElementById('pw-len').textContent=len;
  if(!len){['pw-force','pw-time','pw-ent'].forEach(id=>document.getElementById(id).textContent='—');document.getElementById('pw-bar').style.width='0';document.getElementById('pw-tips').textContent='Tape un mot de passe pour analyser.';return;}
  let cs=0;if(/[a-z]/.test(pw))cs+=26;if(/[A-Z]/.test(pw))cs+=26;if(/[0-9]/.test(pw))cs+=10;if(/[^a-zA-Z0-9]/.test(pw))cs+=32;
  const ent=Math.round(len*Math.log2(cs||1)); document.getElementById('pw-ent').textContent=ent;
  const common=['azerty','password','123456','qwerty','azerty123','password123','admin','letmein'];
  const isCommon=common.some(c=>pw.toLowerCase().includes(c));
  let s=0;if(len>=8)s++;if(len>=12)s++;if(len>=16)s++;if(/[A-Z]/.test(pw))s++;if(/[0-9]/.test(pw))s++;if(/[^a-zA-Z0-9]/.test(pw))s++;if(isCommon)s=Math.max(0,s-3);
  const lvls=[{l:'Très faible',c:'#ff4455',p:8,t:'Instantané'},{l:'Faible',c:'#ff7744',p:22,t:'Quelques secondes'},{l:'Moyen',c:'#ffaa00',p:45,t:'Quelques heures'},{l:'Fort',c:'#44cc88',p:72,t:'Plusieurs années'},{l:'Très fort',c:'#00ff88',p:100,t:'> 1 milliard d\'années'}];
  const lv=lvls[s>5?4:s>3?3:s>2?2:s>1?1:0];
  const fe=document.getElementById('pw-force');fe.textContent=lv.l;fe.style.color=lv.c;
  document.getElementById('pw-time').textContent=lv.t;
  const bar=document.getElementById('pw-bar');bar.style.width=lv.p+'%';bar.style.background=lv.c;
  let tips=[];
  if(len<12)tips.push('→ Allonge le mot de passe (12+ caractères)');
  if(!/[A-Z]/.test(pw))tips.push('→ Ajoute des majuscules');
  if(!/[0-9]/.test(pw))tips.push('→ Ajoute des chiffres');
  if(!/[^a-zA-Z0-9]/.test(pw))tips.push('→ Ajoute des symboles');
  if(isCommon)tips.push('⚠ Trop courant — dans les listes de hackers !');
  if(s>=5)tips=['✓ Excellent ! Utilise Bitwarden pour stocker des mots de passe uniques.'];
  document.getElementById('pw-tips').innerHTML=tips.join('<br>')||'✓ Très bon !';
}

    +'<span style="font-size:10px;font-family:var(--mono);padding:2px 8px;border-radius:20px;border:1px solid var(--purple);color:var(--purple)">OSINT<\/span>'
    +'<span style="font-size:15px;font-weight:700">'+cas.title+'<\/span>'
    +'<span style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted)">'+(osintIdx+1)+'/'+OSINT_CASES.length+'<\/span>'
    +'<\/div>'
    +'<div style="background:var(--bg3);border:2px dashed var(--border2);border-radius:10px;margin-bottom:14px;overflow:hidden;min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:10px">'
    +'<img id="osint-img" src="'+(cas.localUrl||cas.filename)+'" style="max-width:100%;max-height:380px;border-radius:8px;display:block" />'
    +'<div id="osint-placeholder" style="display:none;flex-direction:column;align-items:center;gap:10px;padding:20px;color:var(--muted);text-align:center">'
    +'<div style="font-size:36px">🖼️<\/div>'
    +'<div style="font-size:13px;font-family:var(--mono)">'+cas.filename+'<\/div>'
    +'<div style="font-size:12px">Image non trouvée — place-la dans le même dossier<\/div>'
    +'<label style="cursor:pointer;background:var(--green);color:#000;padding:8px 16px;border-radius:7px;font-size:13px;font-weight:700">'
    +'Charger l\'image <input type="file" accept="image/*" style="display:none" onchange="loadOSINTImg(this)">'
    +'<\/label>'
    +'<\/div>'
    +'<\/div>'
    +'<div style="margin-bottom:12px">'
    +'<div class="sl" style="margin-bottom:6px">Réponse — adresse / localisation<\/div>'
    +'<input type="text" id="osint-ans" placeholder="Ex: 12 rue de la Paix, Moulins 03000" value="'+cas.answer+'" style="width:100%" onchange="OSINT_CASES[osintIdx].answer=this.value">'
    +'<\/div>'
    +'<div style="margin-bottom:12px">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'
    +'<div class="sl">Indices<\/div>'
    +'<button class="btn bg bsm" id="indice-btn" onclick="revealNextIndice()">💡 Révéler indice 1<\/button>'
    +'<\/div>'
    +'<div id="osint-indices-anim"><\/div>'
    +'<\/div>'
    +'<div style="margin-bottom:12px">'
    +'<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">'
    +'<div class="sl">Timer<\/div>'
    +'<select id="osint-timer-sel" style="font-size:11px">'
    +'<option value="60">1 min<\/option>'
    +'<option value="120" selected>2 min<\/option>'
    +'<option value="180">3 min<\/option>'
    +'<option value="300">5 min<\/option>'
    +'<\/select>'
    +'<button class="btn bg bsm" onclick="startOSINTTimer()">▶ Démarrer<\/button>'
    +'<span style="font-family:var(--mono);font-size:20px;font-weight:700;color:var(--green)" id="osint-timer-disp">—<\/span>'
    +'<\/div>'
    +'<div class="tbar"><div class="tfill" id="osint-tfill" style="width:100%;background:var(--green)"><\/div><\/div>'
    +'<\/div>'
    +'<div style="margin-bottom:12px">'
    +'<div class="sl" style="margin-bottom:6px">Réponses joueurs (<span id="osint-sub-count">0<\/span>)<\/div>'
    +'<div id="osint-subs" style="max-height:120px;overflow-y:auto"><div style="font-size:11px;color:var(--muted)">Aucune réponse<\/div><\/div>'
    +'<\/div>'
    +'<div id="osint-reveal-zone" style="display:none;padding:12px;background:rgba(0,255,136,.08);border:1px solid var(--green);border-radius:8px;margin-bottom:12px">'
    +'<div style="font-size:14px;font-weight:700;color:var(--green)">✓ <span id="osint-reveal-txt"><\/span><\/div>'
    +'<\/div>'
    +'<div class="flex">'
    +'<button class="btn bg" onclick="revealOSINTAnswer()">✓ Révéler la réponse<\/button>'
    +'<button class="btn bo bsm" onclick="if(osintIdx>0){osintIdx--;renderOSINTCenter()}" '+(osintIdx===0?'disabled':'')+'>← Préc<\/button>'
    +'<button class="btn bg bsm" onclick="if(osintIdx<OSINT_CASES.length-1){osintIdx++;renderOSINTCenter()}">Suiv →<\/button>'
    +'<\/div><\/div>';

  // Check image load
  const img = document.getElementById('osint-img');
  const ph = document.getElementById('osint-placeholder');
  if (img) {
    img.onerror = function() {
      img.style.display='none';
      if(ph){ph.style.display='flex';}
    };
  }

  pub('host:osint', {index:osintIdx, total:OSINT_CASES.length, title:cas.title, filename:cas.filename});
}

function loadOSINTImg(input) {
  const file = input.files[0]; if(!file) return;
  OSINT_CASES[osintIdx].localUrl = URL.createObjectURL(file);
  renderOSINTCenter();
}

function revealNextIndice() {
  const cas = OSINT_CASES[osintIdx];
  if (osintRevealedIndices >= cas.indices.length) return;
  const text = cas.indices[osintRevealedIndices];
  osintRevealedIndices++;
  const el = document.getElementById('osint-indices-anim');
  if (el) {
    const div = document.createElement('div');
    div.style.cssText='display:flex;gap:8px;padding:7px 10px;background:var(--bg3);border-radius:6px;margin-bottom:5px;font-size:12px';
    div.innerHTML='<span style="color:var(--amber);font-family:var(--mono);flex-shrink:0">'+osintRevealedIndices+'.<\/span><span>'+text+'<\/span>';
    el.appendChild(div);
  }
  const btn = document.getElementById('indice-btn');
  if (btn) {
    if (osintRevealedIndices >= cas.indices.length) { btn.textContent='✓ Tous les indices révélés'; btn.disabled=true; }
    else btn.textContent='💡 Révéler indice '+(osintRevealedIndices+1);
  }
  pub('host:osint_indice', {index:osintIdx, indiceIdx:osintRevealedIndices-1, text});
}

function startOSINTTimer() {
  clearInterval(osintTimerInt);
  const dur = parseInt(document.getElementById('osint-timer-sel').value)||120;
  osintTimeLeft = dur;
  const total = dur;
  pub('host:osint_timer', {duration:dur});
  osintTimerInt = setInterval(()=>{
    osintTimeLeft = Math.max(0, osintTimeLeft-1);
    const pct = osintTimeLeft/total*100;
    const col = pct>50?'var(--green)':pct>25?'var(--amber)':'var(--red)';
    const mins = Math.floor(osintTimeLeft/60), secs = osintTimeLeft%60;
    const d=document.getElementById('osint-timer-disp'), f=document.getElementById('osint-tfill');
    if(d){d.textContent=mins+':'+String(secs).padStart(2,'0');d.style.color=col;}
    if(f){f.style.width=pct+'%';f.style.background=col;}
    pub('host:tick',{timeLeft:osintTimeLeft,mod:'osint'});
    if(osintTimeLeft<=0) clearInterval(osintTimerInt);
  },1000);
}

function revealOSINTAnswer() {
  clearInterval(osintTimerInt);
  const ans = document.getElementById('osint-ans')?document.getElementById('osint-ans').value:OSINT_CASES[osintIdx].answer;
  OSINT_CASES[osintIdx].answer = ans;
  const zone=document.getElementById('osint-reveal-zone'), txt=document.getElementById('osint-reveal-txt');
  if(zone) zone.style.display='block';
  if(txt) txt.textContent = ans||'(non renseignée)';
  pub('host:osint_reveal',{answer:ans, index:osintIdx});
}

function updateOSINTSubmissions() {
  const subs = Object.values(osintSubmissions);
  const el=document.getElementById('osint-subs'), cnt=document.getElementById('osint-sub-count');
  if(cnt) cnt.textContent=subs.length;
  if(el) el.innerHTML=subs.map(s=>'<div style="display:flex;gap:8px;padding:5px 8px;background:var(--bg3);border-radius:5px;margin-bottom:4px;font-size:12px"><div style="font-weight:700;color:'+(s.teamColor||'var(--green)')+'">'+s.team+'<\/div><div style="flex:1">'+s.text+'<\/div><\/div>').join('')||'<div style="font-size:11px;color:var(--muted)">Aucune réponse<\/div>';
}


// ── TOAST ──
function toast(msg) {
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

// ── INIT ──
window.addEventListener('load', function(){ if(typeof Ably!=='undefined'){initAbly();}else{var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/ably/ably.min.js';s.onload=initAbly;document.head.appendChild(s);}});
</script>
